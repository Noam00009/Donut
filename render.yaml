services:
  - type: web
    name: donutan-site
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/Noam00009/Donut
    branch: admin-dashboard
    buildCommand: npm ci --include=dev && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
